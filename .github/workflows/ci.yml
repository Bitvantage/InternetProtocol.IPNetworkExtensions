# Builds, tests and packs every push to main and every pull request to main, and publishes the packages to nuget.org when
# a version tag such as v1.0.0 is pushed. A manual run builds a chosen tag or commit, and publishes it when asked to.
#
# Publishing uses nuget.org Trusted Publishing: the publish job trades a GitHub OIDC token for an API key that lasts an
# hour, so no API key is stored in the repository. It needs a Trusted Publishing policy on nuget.org for this repository
# and this workflow file.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        type: string
        description: Tag or commit to build. Empty builds the selected branch.
        default: ''
      publish:
        type: boolean
        description: Push the packages to nuget.org. Existing versions are skipped.
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # the full history lets Source Link and the package metadata record the exact commit
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v5
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v6
        with:
          name: nupkg
          path: artifacts

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Bitvantage

      # --skip-duplicate also skips the .snupkg beside a .nupkg that is already published, so the symbol packages are
      # pushed on their own as well, which uploads symbols for a version whose package already exists
      - name: Publish to nuget.org
        run: |
          dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push artifacts/*.snupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
